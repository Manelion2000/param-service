services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reconciliation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MAE2020
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reconciliation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reconciliation.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reconciliation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: MAE2020
    ports:
      - "8087:8087"
    volumes:
      - app_data:/app/datas

  frontend:
    build:
      context: ../reconcillation-frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "4200:80"

volumes:
  pg_data:
  pgadmin_data:
  app_data:
