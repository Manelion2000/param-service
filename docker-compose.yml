services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reconciliation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MAE2020
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reconciliation.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8083:8083"

volumes:
  pg_data:
  pgadmin_data:
